"$schema" = 'https://starship.rs/config-schema.json'

# ───────────────────────────────────────────────────────────────
#  Powerlevel10k "rainbow"-style: powerline, 1 line, compact.
#  Left: OS · directory · Git
#  Right: exit status · duration · jobs · direnv · languages · user@host (SSH/root)
#  Flat heads, flat tails.
# ───────────────────────────────────────────────────────────────

add_newline = false
palette = 'p10k'

format = """
$os\
$username\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$direnv\
$nodejs\
$bun\
$python\
$rust\
$golang"""


# ANSI 256 colors based on the original Powerlevel10k profile.
[palettes.p10k]
seg_fg = '0'
os_bg = '0'
os_fg = '196'
dir_bg = '52'
dir_fg = '254'
git_bg = '178'
git_dirty_bg = '3'

# ── Left ───────────────────────────────────────────────────────

[os]
disabled = false
format = '[ $symbol ](bold fg:os_fg bg:os_bg)'

# Nerd Font glyphs per OS, borrowed from the official gruvbox-rainbow preset.
# `Linux` is the generic fallback for distros without their own entry.
[os.symbols]
Arch = '󰣇'
Artix = '󰣇'
CachyOS = "C"
Ubuntu = '󰕈'
Debian = '󰣚'
Mint = '󰣭'
Pop = ''
Fedora = '󰣛'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'
CentOS = ''
SUSE = ''
Gentoo = '󰣨'
Manjaro = ''
EndeavourOS = ''
Alpine = ''
Raspbian = '󰐿'
Amazon = ''
Android = ''
AOSC = ''
Linux = '󰌽'
Macos = '󰀵'
Windows = '󰍲'

[directory]
# Removeu a seta manual do final, terminando o texto de forma limpa
format = '[](fg:#121212 bg:dir_bg)[ $path ](bold fg:dir_fg bg:dir_bg)([$read_only ]($read_only_style))'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true

# The lock appears inside the segment when the directory is not writable,
# like p10k's DIR_SHOW_WRITABLE.
read_only = '󰌾'
read_only_style = 'bold fg:dir_fg bg:dir_bg'


# ── Git branch ─────────────────────────────────────────────────

[git_branch]
only_attached = true
always_show_remote = false
symbol = ''
# Removeu a seta solta do final; ela agora é gerenciada de forma dinâmica pelo status
format = '[](fg:dir_bg bg:git_bg)[ $symbol $branch(:$remote_branch) ](bold fg:seg_fg bg:git_bg)'
truncation_length = 32
truncation_symbol = '…'


# ── Detached commit and tag ────────────────────────────────────

[git_commit]
only_detached = true
commit_hash_length = 7
tag_disabled = false
tag_max_candidates = 0
tag_symbol = '  '
# Removeu a seta solta do final para seguir a mesma regra do branch
format = '[](fg:dir_bg bg:git_bg)[  $hash$tag ](bold fg:seg_fg bg:git_bg)'


# ── Git operation in progress ──────────────────────────────────

[git_state]
# Show operations such as REBASE 3/10, MERGE or CHERRY-PICK.
format = '[$state( $progress_current/$progress_total) ](bold fg:seg_fg bg:git_bg)'

rebase = 'REBASE'
merge = 'MERGE'
revert = 'REVERT'
cherry_pick = 'CHERRY-PICK'
bisect = 'BISECT'
am = 'AM'
am_or_rebase = 'AM/REBASE'

# ── Git line metrics ───────────────────────────────────────────

[git_metrics]
# Optional: show the number of added and deleted lines.
# Set this to false if you want to enable the module.
disabled = true
only_nonzero_diffs = true

format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'
added_style = 'fg:seg_fg bg:git_bg'
deleted_style = 'fg:seg_fg bg:git_bg'

# ── Git repository status ──────────────────────────────────────

[git_status]
# O segredo é colocar as setas de fechamento dentro do mesmo grupo condicional.
# Se houver modificações, ele renderiza o bloco modificado e fecha com a seta escura.
# Se o repositório estiver limpo, o bloco inteiro some e não quebra nada.
format = '([](fg:git_bg bg:git_dirty_bg)[$all_status$ahead_behind ](fg:seg_fg bg:git_dirty_bg)[](fg:git_dirty_bg))'

conflicted = ' =${count}'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''

untracked = ' ?${count}'
stashed = ' *${count}'
modified = ' !${count}'
staged = ' +${count}'
renamed = ' »${count}'
deleted = ' ✘${count}'
typechanged = ' T${count}'

# ── Prompt character ───────────────────────────────────────────

[character]
format = ' $symbol '
success_symbol = '[❯](bold #52)' # O seu laranja vibrante quando o comando der certo!
error_symbol = '[❯](bold red)'       # Vermelho vibrante se o comando falhar
vimcmd_symbol = '[❮](bold yellow)'   # Amarelo se você usar o modo Vi do terminal


# ── Right ──────────────────────────────────────────────────────

[status]
# Nothing on success; on failure the exit code, the signal name when one
# killed the command (✘ 130 INT), and every member of a failed pipe
# (✘ 0 |✘ 1). Replaces p10k's status segment, minus its ✔ on success.
disabled = false
format = '[$symbol$status( $signal_name) ]($style)'
symbol = '✘ '
success_symbol = ''
not_executable_symbol = '✘ '
not_found_symbol = '✘ '
sigint_symbol = '✘ '
signal_symbol = '✘ '
map_symbol = true
style = 'bold red'
pipestatus = true
pipestatus_separator = '|'
pipestatus_format = '[$pipestatus]($style)'

[cmd_duration]
min_time = 500
format = '[󰔛 $duration ]($style)'
style = 'yellow'

[jobs]
# ✦ while something runs in the background, with the count from two jobs
# up. Cyan like p10k's background_jobs icon.
format = '[$symbol$number ]($style)'
symbol = '✦'
style = 'bold cyan'

[direnv]
# A chip whenever the directory carries an .envrc, yellow like p10k's
# direnv segment.
disabled = false
format = '[$symbol ]($style)'
symbol = 'direnv'
style = 'yellow'

[nodejs]
format = '[$symbol$version ]($style)'
symbol = ' '
style = 'green'

[bun]
format = '[$symbol$version ]($style)'
symbol = ' '
style = 'white'

[python]
# Show the virtual environment name only when one is active.
format = '[$symbol$version( \($virtualenv\)) ]($style)'
symbol = ' '
style = 'yellow'

[rust]
format = '[$symbol$version ]($style)'
symbol = '󱘗 '
style = 'red'

[golang]
format = '[$symbol$version ]($style)'
symbol = ' '
style = 'cyan'

# ── user@host, only when it matters ────────────────────────────
# Hidden locally; user@host appears over SSH, red user when root.
# Replaces p10k's context segment.

[username]
show_always = true
# Seta padrão para a direita nascendo do vermelho do SO e indo para o cinza escuro
format = '[](fg:os_bg bg:#121212)[ $user ](bold fg:255 bg:#121212)'
